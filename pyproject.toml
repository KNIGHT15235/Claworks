
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-posttrain-project"
version = "0.1.0"
description = "Phase 1 skeleton for after-sales Agentic RL post-training."
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2",
]

[project.optional-dependencies]
monitoring = [
  "tensorboard>=2.15",
  "wandb>=0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "envs*", "schemas*", "routing*", "train*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
